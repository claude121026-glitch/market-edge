# Market Edge scheduled jobs. GitHub cron is in UTC (IST = UTC + 5:30); runs can start a few minutes late.
name: market-edge jobs

on:
  schedule:
    - cron: "20 2 * * 1-5"       # 07:50 IST  morning brief (GitHub often starts runs 30-60 min late)
    - cron: "50 2 * * 1-5"       # 08:20 IST  morning (backup; skips if already sent)
    - cron: "10,40 1-17 * * 1-5" # every 30 min, 06:40-23:10 IST Mon-Fri: prices + news + corporate (quiet)
    - cron: "40 1-16 * * 0,6"    # hourly on weekends, 07:10-22:10 IST
    - cron: "50 12 * * 1-5"      # 18:20 IST  evening scan (skips until NSE has published today's file)
    - cron: "20 13 * * 1-5"      # 18:50 IST  evening (backup)
    - cron: "5 14 * * 1-5"       # 19:35 IST  evening (backup)
    - cron: "10 15 * * 1-5"      # 20:40 IST  evening (last backup)
    - cron: "30 4 * * 6"         # Sat 10:00 IST  weekly backtest + keep-alive commit
  workflow_dispatch:
    inputs:
      command:
        description: "bootstrap (first time), refresh, evening, morning, news, corp, prices, paper, backtest, telegram-check"
        required: true
        default: bootstrap

permissions:
  contents: write                # upload the data release; weekly keep-alive commit

concurrency:                     # one data-writing job at a time
  group: market-edge-data
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TZ: Asia/Kolkata
      GH_TOKEN: ${{ github.token }}
      WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
      WHATSAPP_APIKEY: ${{ secrets.WHATSAPP_APIKEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      ME_RISK_PER_TRADE: ${{ vars.ME_RISK_PER_TRADE }}     # optional repo variable, default 1000
      ME_MAX_POSITION: ${{ vars.ME_MAX_POSITION }}         # optional repo variable, default 200000
      ME_SMALL_ACCOUNT: ${{ vars.ME_SMALL_ACCOUNT }}
      ME_SMALL_CAPITAL: ${{ vars.ME_SMALL_CAPITAL }}
      ME_SMALL_LEVERAGE: ${{ vars.ME_SMALL_LEVERAGE }}
      ME_SMALL_TARGET_PCT: ${{ vars.ME_SMALL_TARGET_PCT }}
      ME_SMALL_STOP_PCT: ${{ vars.ME_SMALL_STOP_PCT }}
      ME_SMALL_CANDIDATES: ${{ vars.ME_SMALL_CANDIDATES }}
      ME_SMALL_SIDE: ${{ vars.ME_SMALL_SIDE }}
      ME_SMALL_LAST_ENTRY: ${{ vars.ME_SMALL_LAST_ENTRY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: market_edge/requirements-ci.txt
      - run: pip install -q -r market_edge/requirements-ci.txt

      - name: Pick the command for this schedule
        id: pick
        run: |
          case "${{ github.event.schedule }}" in
            "20 2 * * 1-5"|"50 2 * * 1-5")  c=morning ;;
            "10,40 1-17 * * 1-5"|"40 1-16 * * 0,6") c=refresh ;;
            "50 12 * * 1-5"|"20 13 * * 1-5"|"5 14 * * 1-5"|"10 15 * * 1-5") c=evening ;;
            "30 4 * * 6")                  c=backtest ;;
            *)                             c="${{ inputs.command }}" ;;
          esac
          echo "cmd=$c" >> "$GITHUB_OUTPUT"
          echo "Running: $c"

      - name: Get the latest data
        run: bash market_edge/deploy/github/data.sh pull ${{ steps.pick.outputs.cmd == 'bootstrap' && '--allow-missing' || '' }}

      - name: Bootstrap (first run only, ~10 min)
        if: steps.pick.outputs.cmd == 'bootstrap'
        run: |
          python -m market_edge.run update --days 380
          python -m market_edge.run backtest
          python -m market_edge.run prices

      - name: Merge today's live-tracker data
        if: steps.pick.outputs.cmd == 'evening'
        run: |
          bash market_edge/deploy/github/data.sh pull-intraday "$(date +%Y%m%d)"
          ls /tmp/intraday/*.db >/dev/null 2>&1 && python -m market_edge.run merge-intraday /tmp/intraday/*.db || true

      - name: Run ${{ steps.pick.outputs.cmd }}
        if: steps.pick.outputs.cmd != 'bootstrap'
        run: python -m market_edge.run ${{ steps.pick.outputs.cmd }}

      - name: Save the data
        run: bash market_edge/deploy/github/data.sh push

      - name: Weekly housekeeping and keep-alive
        if: steps.pick.outputs.cmd == 'backtest'
        run: |
          bash market_edge/deploy/github/data.sh prune 14
          # GitHub pauses schedules in repos with no activity for 60 days; a weekly commit prevents that.
          mkdir -p status && date -Iseconds > status/last_backtest.txt
          git config user.name "market-edge-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status/last_backtest.txt
          git commit -m "Weekly keep-alive" && git push || true
